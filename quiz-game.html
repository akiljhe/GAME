<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Warna & Bentuk - Petualangan Belajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #FF6B9D 0%, #C7CEEA 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'Fredoka One', cursive;
        }
        .answer-btn {
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }
        .answer-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        .answer-btn.correct {
            background: linear-gradient(135deg, #6BCF7F, #95E1D3);
            animation: correctAnswer 0.6s ease-out;
        }
        .answer-btn.incorrect {
            background: linear-gradient(135deg, #FF6B9D, #FFA07A);
            animation: incorrectAnswer 0.6s ease-out;
        }
        @keyframes correctAnswer {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes incorrectAnswer {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }
        .timer-circle {
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 1s linear;
        }
        .question-image {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .celebration {
            animation: celebrate 1s ease-out;
        }
        @keyframes celebrate {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        .score-popup {
            animation: scoreFloat 1.5s ease-out forwards;
        }
        @keyframes scoreFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        .progress-ring {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="relative">
    <!-- Header -->
    <div class="bg-white/20 backdrop-blur-sm border-b border-white/30">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <button onclick="goBack()" class="flex items-center gap-2 text-white hover:text-pink-200 transition-colors">
                    <span class="text-2xl">←</span>
                    <span class="font-semibold">Kembali</span>
                </button>
                
                <div class="text-center">
                    <h1 class="title-font text-2xl text-white">Kuis Warna & Bentuk</h1>
                    <div class="flex items-center justify-center gap-2 mt-1">
                        <span class="text-white/80">Soal <span id="current-question">1</span>/10</span>
                        <span class="text-white/80">•</span>
                        <span class="text-white/80"><span id="current-score">0</span> Poin</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="text-center">
                        <div class="relative w-12 h-12">
                            <svg class="w-12 h-12" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" stroke="rgba(255,255,255,0.3)" stroke-width="8" fill="none"/>
                                <circle cx="50" cy="50" r="45" stroke="white" stroke-width="8" fill="none" 
                                        class="timer-circle" id="timer-circle"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span class="text-white font-bold text-sm" id="timer-text">15</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Area -->
    <div class="container mx-auto px-4 py-8">
        <!-- Question Section -->
        <div class="bg-white/20 backdrop-blur-sm rounded-3xl p-8 mb-8 text-center">
            <h2 class="title-font text-3xl text-white mb-6" id="question-text">
                Pilih warna merah!
            </h2>
            
            <!-- Question Image/Shape -->
            <div class="flex justify-center mb-6">
                <div id="question-visual" class="question-image w-32 h-32 rounded-2xl bg-red-500 flex items-center justify-center">
                    <span class="text-6xl" id="question-emoji">🔴</span>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-white/20 rounded-full h-3 mb-4">
                <div class="bg-gradient-to-r from-pink-400 to-purple-500 h-3 rounded-full transition-all duration-500" 
                     id="progress-bar" style="width: 10%"></div>
            </div>
        </div>

        <!-- Answer Options -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="answer-options">
            <!-- Answer buttons will be generated here -->
        </div>

        <!-- Feedback Area -->
        <div id="feedback-area" class="text-center mb-8">
            <!-- Feedback messages will appear here -->
        </div>

        <!-- Score Display -->
        <div class="fixed bottom-4 right-4 bg-white/20 backdrop-blur-sm rounded-2xl p-4">
            <div class="flex items-center gap-2">
                <span class="text-2xl">⭐</span>
                <span class="text-white font-bold text-lg" id="stars-earned">0</span>
                <span class="text-white/80 text-sm">Bintang</span>
            </div>
        </div>

        <!-- Combo Display -->
        <div class="fixed bottom-4 left-4 bg-white/20 backdrop-blur-sm rounded-2xl p-4" id="combo-display" style="display: none;">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🔥</span>
                <span class="text-white font-bold text-lg" id="combo-count">0</span>
                <span class="text-white/80 text-sm">Combo</span>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-green-400 to-blue-500 rounded-full flex items-center justify-center celebration">
                <span class="text-3xl" id="result-emoji">🎉</span>
            </div>
            <h3 class="title-font text-2xl text-gray-800 mb-3" id="result-title">Selamat!</h3>
            <p class="text-gray-600 mb-6" id="result-message">Kamu berhasil menyelesaikan kuis ini!</p>
            
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-500" id="final-score">0</div>
                    <div class="text-sm text-gray-500">Poin</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-yellow-500" id="final-stars">0</div>
                    <div class="text-sm text-gray-500">Bintang</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-500" id="correct-answers">0</div>
                    <div class="text-sm text-gray-500">Benar</div>
                </div>
            </div>
            
            <div class="flex gap-3 justify-center">
                <button onclick="restartQuiz()" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all">
                    Ulangi
                </button>
                <button onclick="goBack()" class="bg-gray-400 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all">
                    Menu Utama
                </button>
            </div>
        </div>
    </div>

    <script src="simple-audio.js"></script>
    <script>
        // Quiz Game Controller
        class QuizGame {
            constructor() {
                this.currentQuestion = 0;
                this.totalQuestions = 10;
                this.score = 0;
                this.stars = 0;
                this.correctAnswers = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.timeLeft = 15;
                this.timer = null;
                this.isPaused = false;
                
                this.questions = [
                    // Color questions
                    { type: 'color', question: 'Pilih warna merah!', correct: 'red', options: ['red', 'blue', 'green', 'yellow'], emoji: '🔴' },
                    { type: 'color', question: 'Pilih warna biru!', correct: 'blue', options: ['red', 'blue', 'green', 'purple'], emoji: '🔵' },
                    { type: 'color', question: 'Pilih warna hijau!', correct: 'green', options: ['red', 'blue', 'green', 'orange'], emoji: '🟢' },
                    { type: 'color', question: 'Pilih warna kuning!', correct: 'yellow', options: ['red', 'blue', 'green', 'yellow'], emoji: '🟡' },
                    { type: 'color', question: 'Pilih warna ungu!', correct: 'purple', options: ['red', 'blue', 'purple', 'yellow'], emoji: '🟣' },
                    
                    // Shape questions
                    { type: 'shape', question: 'Pilih bentuk lingkaran!', correct: 'circle', options: ['circle', 'square', 'triangle', 'star'], emoji: '⭕' },
                    { type: 'shape', question: 'Pilih bentuk persegi!', correct: 'square', options: ['circle', 'square', 'triangle', 'heart'], emoji: '⬜' },
                    { type: 'shape', question: 'Pilih bentuk segitiga!', correct: 'triangle', options: ['circle', 'square', 'triangle', 'diamond'], emoji: '🔺' },
                    { type: 'shape', question: 'Pilih bentuk bintang!', correct: 'star', options: ['circle', 'square', 'star', 'heart'], emoji: '⭐' },
                    { type: 'shape', question: 'Pilih bentuk hati!', correct: 'heart', options: ['circle', 'square', 'star', 'heart'], emoji: '❤️' }
                ];
                
                this.colorMap = {
                    red: '#EF4444',
                    blue: '#3B82F6',
                    green: '#10B981',
                    yellow: '#F59E0B',
                    purple: '#8B5CF6',
                    orange: '#F97300',
                    pink: '#EC4899',
                    brown: '#A3A3A3'
                };
                
                this.shapeMap = {
                    circle: 'rounded-full',
                    square: 'rounded-lg',
                    triangle: 'clip-path: polygon(50% 0%, 0% 100%, 100% 100%)',
                    star: 'clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)',
                    heart: 'clip-path: polygon(50% 85%, 85% 50%, 70% 35%, 50% 50%, 30% 35%, 15% 50%)',
                    diamond: 'clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)'
                };
                
                this.init();
            }

            init() {
                this.shuffleQuestions();
                this.loadQuestion();
                this.updateUI();
                this.startTimer();
            }

            shuffleQuestions() {
                // Shuffle questions array
                for (let i = this.questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.questions[i], this.questions[j]] = [this.questions[j], this.questions[i]];
                }
            }

            loadQuestion() {
                if (this.currentQuestion >= this.totalQuestions) {
                    this.endQuiz();
                    return;
                }

                const question = this.questions[this.currentQuestion];
                
                // Update question text
                document.getElementById('question-text').textContent = question.question;
                
                // Update visual
                this.updateQuestionVisual(question);
                
                // Generate answer options
                this.generateAnswerOptions(question);
                
                // Reset timer
                this.timeLeft = 15;
                this.startTimer();
                
                // Update progress
                this.updateProgress();
            }

            updateQuestionVisual(question) {
                const visual = document.getElementById('question-visual');
                const emoji = document.getElementById('question-emoji');
                
                if (question.type === 'color') {
                    visual.className = 'question-image w-32 h-32 rounded-2xl flex items-center justify-center';
                    visual.style.backgroundColor = this.colorMap[question.correct];
                    emoji.textContent = question.emoji;
                } else {
                    visual.className = 'question-image w-32 h-32 bg-gradient-to-br from-pink-400 to-purple-500 flex items-center justify-center';
                    visual.style.clipPath = this.shapeMap[question.correct] || '';
                    emoji.textContent = question.emoji;
                }
            }

            generateAnswerOptions(question) {
                const container = document.getElementById('answer-options');
                container.innerHTML = '';
                
                // Shuffle options
                const shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);
                
                shuffledOptions.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'answer-btn bg-white/30 backdrop-blur-sm rounded-2xl p-6 text-center hover:bg-white/40 transition-all';
                    button.onclick = () => this.selectAnswer(option);
                    
                    if (question.type === 'color') {
                        const colorDiv = document.createElement('div');
                        colorDiv.className = 'w-16 h-16 mx-auto mb-3 rounded-xl';
                        colorDiv.style.backgroundColor = this.colorMap[option];
                        button.appendChild(colorDiv);
                        
                        const label = document.createElement('div');
                        label.className = 'text-white font-semibold text-lg';
                        label.textContent = option.charAt(0).toUpperCase() + option.slice(1);
                        button.appendChild(label);
                    } else {
                        const shapeDiv = document.createElement('div');
                        shapeDiv.className = 'w-16 h-16 mx-auto mb-3 bg-gradient-to-br from-pink-400 to-purple-500';
                        shapeDiv.style.clipPath = this.shapeMap[option] || '';
                        button.appendChild(shapeDiv);
                        
                        const label = document.createElement('div');
                        label.className = 'text-white font-semibold text-lg';
                        label.textContent = option.charAt(0).toUpperCase() + option.slice(1);
                        button.appendChild(label);
                    }
                    
                    container.appendChild(button);
                });
            }

            selectAnswer(selectedAnswer) {
                if (this.isPaused) return;
                
                const question = this.questions[this.currentQuestion];
                const isCorrect = selectedAnswer === question.correct;
                
                // Disable all buttons
                const buttons = document.querySelectorAll('.answer-btn');
                buttons.forEach(btn => btn.disabled = true);
                
                if (isCorrect) {
                    this.handleCorrectAnswer(selectedAnswer);
                } else {
                    this.handleIncorrectAnswer(selectedAnswer, question.correct);
                }
                
                // Stop timer
                this.stopTimer();
                
                // Move to next question after delay
                setTimeout(() => {
                    this.currentQuestion++;
                    this.loadQuestion();
                }, 2000);
            }

            handleCorrectAnswer(answer) {
                // Find and style the correct button
                const buttons = document.querySelectorAll('.answer-btn');
                buttons.forEach(btn => {
                    if (btn.textContent.toLowerCase().includes(answer)) {
                        btn.classList.add('correct');
                    }
                });
                
                // Update score
                const baseScore = 10;
                const timeBonus = Math.max(0, this.timeLeft * 2);
                const comboBonus = this.combo * 5;
                const totalScore = baseScore + timeBonus + comboBonus;
                
                this.score += totalScore;
                this.correctAnswers++;
                this.combo++;
                this.maxCombo = Math.max(this.maxCombo, this.combo);
                
                // Show floating score
                this.showFloatingScore(totalScore);
                
                // Update combo display
                this.updateComboDisplay();
                
                // Show feedback
                this.showFeedback('Benar! 🎉', 'success');
                
                // Play correct sound
                this.playCorrectSound();
            }

            handleIncorrectAnswer(selected, correct) {
                // Style incorrect button
                const buttons = document.querySelectorAll('.answer-btn');
                buttons.forEach(btn => {
                    if (btn.textContent.toLowerCase().includes(selected)) {
                        btn.classList.add('incorrect');
                    }
                    if (btn.textContent.toLowerCase().includes(correct)) {
                        btn.classList.add('correct');
                    }
                });
                
                // Reset combo
                this.combo = 0;
                this.updateComboDisplay();
                
                // Show feedback
                this.showFeedback('Salah! 😅', 'error');
                
                // Play incorrect sound
                this.playIncorrectSound();
            }

            showFloatingScore(score) {
                const floatingScore = document.createElement('div');
                floatingScore.className = 'score-popup fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl font-bold text-green-500 pointer-events-none z-50';
                floatingScore.textContent = `+${score}`;
                
                document.body.appendChild(floatingScore);
                
                setTimeout(() => {
                    floatingScore.remove();
                }, 1500);
            }

            updateComboDisplay() {
                const comboDisplay = document.getElementById('combo-display');
                const comboCount = document.getElementById('combo-count');
                
                if (this.combo > 1) {
                    comboDisplay.style.display = 'block';
                    comboCount.textContent = this.combo;
                    
                    // Animate combo
                    anime({
                        targets: comboDisplay,
                        scale: [1, 1.2, 1],
                        duration: 300,
                        easing: 'easeInOutQuad'
                    });
                } else {
                    comboDisplay.style.display = 'none';
                }
            }

            showFeedback(message, type) {
                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.innerHTML = `
                    <div class="bg-white/20 backdrop-blur-sm rounded-2xl p-4 text-center ${type === 'success' ? 'text-green-200' : 'text-red-200'}">
                        <div class="text-2xl font-bold">${message}</div>
                    </div>
                `;
                
                // Clear feedback after 2 seconds
                setTimeout(() => {
                    feedbackArea.innerHTML = '';
                }, 2000);
            }

            startTimer() {
                this.timeLeft = 15;
                this.updateTimerDisplay();
                
                this.timer = setInterval(() => {
                    if (!this.isPaused) {
                        this.timeLeft--;
                        this.updateTimerDisplay();
                        
                        // Play tick sound
                        if (window.simpleAudio && this.timeLeft > 5) {
                            window.simpleAudio.playTimerTick();
                        }
                        
                        // Play warning sound when time is low
                        if (window.simpleAudio && this.timeLeft <= 5 && this.timeLeft > 0) {
                            window.simpleAudio.playTimerWarning();
                        }
                        
                        if (this.timeLeft <= 0) {
                            this.timeUp();
                        }
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            updateTimerDisplay() {
                const timerText = document.getElementById('timer-text');
                const timerCircle = document.getElementById('timer-circle');
                
                timerText.textContent = this.timeLeft;
                
                // Update circle progress
                const circumference = 2 * Math.PI * 45;
                const offset = circumference - (this.timeLeft / 15) * circumference;
                timerCircle.style.strokeDashoffset = offset;
                
                // Change color based on time
                if (this.timeLeft <= 5) {
                    timerCircle.style.stroke = '#EF4444'; // Red
                } else if (this.timeLeft <= 10) {
                    timerCircle.style.stroke = '#F59E0B'; // Yellow
                } else {
                    timerCircle.style.stroke = '#10B981'; // Green
                }
            }

            timeUp() {
                this.stopTimer();
                this.showFeedback('Waktu habis! ⏰', 'error');
                this.combo = 0;
                this.updateComboDisplay();
                
                // Play timer warning sound
                if (window.simpleAudio) {
                    window.simpleAudio.playTimerWarning();
                }
                
                // Show correct answer
                const question = this.questions[this.currentQuestion];
                const buttons = document.querySelectorAll('.answer-btn');
                buttons.forEach(btn => {
                    if (btn.textContent.toLowerCase().includes(question.correct)) {
                        btn.classList.add('correct');
                    }
                });
                
                setTimeout(() => {
                    this.currentQuestion++;
                    this.loadQuestion();
                }, 2000);
            }

            updateProgress() {
                const progress = ((this.currentQuestion + 1) / this.totalQuestions) * 100;
                document.getElementById('progress-bar').style.width = progress + '%';
                document.getElementById('current-question').textContent = this.currentQuestion + 1;
            }

            updateUI() {
                document.getElementById('current-score').textContent = this.score;
                document.getElementById('stars-earned').textContent = this.stars;
            }

            endQuiz() {
                this.stopTimer();
                
                // Calculate final stars
                this.stars = this.calculateFinalStars();
                
                // Show result modal
                this.showResultModal();
                
                // Save progress
                this.saveProgress();
            }

            calculateFinalStars() {
                const accuracy = this.correctAnswers / this.totalQuestions;
                if (accuracy >= 0.9) return 3;
                if (accuracy >= 0.7) return 2;
                if (accuracy >= 0.5) return 1;
                return 0;
            }

            showResultModal() {
                const modal = document.getElementById('result-modal');
                
                // Update result content
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('final-stars').textContent = this.stars;
                document.getElementById('correct-answers').textContent = this.correctAnswers;
                
                // Set result message based on performance
                const accuracy = this.correctAnswers / this.totalQuestions;
                let title, message, emoji;
                
                if (accuracy >= 0.9) {
                    title = 'Luar Biasa!';
                    message = 'Kamu sangat hebat! 🌟';
                    emoji = '🏆';
                } else if (accuracy >= 0.7) {
                    title = 'Bagus Sekali!';
                    message = 'Kamu sudah cukup baik! 👏';
                    emoji = '🎉';
                } else if (accuracy >= 0.5) {
                    title = 'Cukup Baik!';
                    message = 'Terus berlatih untuk menjadi lebih baik! 💪';
                    emoji = '👍';
                } else {
                    title = 'Terus Berlatih!';
                    message = 'Jangan menyerah, coba lagi! 🌈';
                    emoji = '🤗';
                }
                
                document.getElementById('result-title').textContent = title;
                document.getElementById('result-message').textContent = message;
                document.getElementById('result-emoji').textContent = emoji;
                
                modal.classList.remove('hidden');
                
                // Animate modal
                anime({
                    targets: modal.querySelector('.bg-white'),
                    scale: [0.8, 1],
                    opacity: [0, 1],
                    easing: 'easeOutBack',
                    duration: 500
                });
            }

            saveProgress() {
                const progress = JSON.parse(localStorage.getItem('gameProgress') || '{}');
                if (!progress.quiz) progress.quiz = 0;
                progress.quiz += this.stars;
                localStorage.setItem('gameProgress', JSON.stringify(progress));
                
                const totalStars = parseInt(localStorage.getItem('totalStars') || '0') + this.stars;
                const totalScore = parseInt(localStorage.getItem('totalScore') || '0') + this.score;
                localStorage.setItem('totalStars', totalStars.toString());
                localStorage.setItem('totalScore', totalScore.toString());
            }

            // Audio functions
            playCorrectSound() {
                if (window.simpleAudio) {
                    window.simpleAudio.playSound('success');
                }
            }

            playIncorrectSound() {
                if (window.simpleAudio) {
                    window.simpleAudio.playSound('error');
                }
            }

            // Control functions
            togglePause() {
                this.isPaused = !this.isPaused;
                
                if (this.isPaused) {
                    this.stopTimer();
                    this.showFeedback('Game Dijeda', 'info');
                } else {
                    this.startTimer();
                }
            }

            restartQuiz() {
                this.currentQuestion = 0;
                this.score = 0;
                this.stars = 0;
                this.correctAnswers = 0;
                this.combo = 0;
                this.maxCombo = 0;
                
                this.shuffleQuestions();
                this.loadQuestion();
                this.updateUI();
                
                document.getElementById('result-modal').classList.add('hidden');
            }
        }

        // Global functions
        function goBack() {
            window.location.href = 'index.html';
        }

        function restartQuiz() {
            game.restartQuiz();
        }

        // Initialize game
        let game;
